<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <rect width="600" height="800" fill="#FFFFFF"/>
  <rect x="36" y="36" width="528" height="728" fill="#F7F7F5"/>

  <!-- Registration crosshairs -->
  <g stroke="#111111" stroke-width="1">
    <line x1="60" y1="72" x2="76" y2="72"/><line x1="68" y1="64" x2="68" y2="80"/>
    <line x1="524" y1="72" x2="540" y2="72"/><line x1="532" y1="64" x2="532" y2="80"/>
    <line x1="60" y1="728" x2="76" y2="728"/><line x1="68" y1="720" x2="68" y2="736"/>
    <line x1="524" y1="728" x2="540" y2="728"/><line x1="532" y1="720" x2="532" y2="736"/>
  </g>

  <text x="92" y="77" font-family="monospace" font-size="11" letter-spacing="2" fill="#555555">TYPE SPECIMEN · CJK / LATIN RATIO</text>

  <!-- Large typographic study -->
  <text x="72" y="290" font-family="Helvetica Neue, PingFang SC, Microsoft YaHei, sans-serif" font-weight="600" font-size="190" fill="#111111">Aa</text>
  <line x1="72" y1="292" x2="528" y2="292" stroke="#111111" stroke-width="1"/>
  <line x1="72" y1="154" x2="528" y2="154" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="72" y="360" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="400" font-size="42" letter-spacing="8" fill="#111111">克制 秩序 留白</text>

  <!-- Scale ladder -->
  <g font-family="monospace" fill="#333333">
    <text x="72" y="444" font-size="11" fill="#888888">11px / TRACKING 0.08EM</text>
    <text x="72" y="468" font-size="12">FIRASAT XXI · EDITORIAL INTERFACE SYSTEM</text>
    <line x1="72" y1="490" x2="528" y2="490" stroke="#E0E0DC" stroke-width="1"/>

    <text x="72" y="524" font-size="11" fill="#888888">13px / LINE-HEIGHT 1.85</text>
    <text x="72" y="548" font-size="13" font-family="PingFang SC, Microsoft YaHei, sans-serif">让作品成为画面的唯一主角，退后半步建立秩序。</text>
    <line x1="72" y1="572" x2="528" y2="572" stroke="#E0E0DC" stroke-width="1"/>

    <text x="72" y="606" font-size="11" fill="#888888">TABULAR NUMS / 0123456789</text>
    <text x="72" y="638" font-size="24" fill="#111111">¥90  ¥120  ¥150  2026.11</text>
  </g>

  <text x="92" y="732" font-family="monospace" font-size="11" fill="#666666">XU NING · ARCHIVE STUDY NO.03</text>
</svg>
